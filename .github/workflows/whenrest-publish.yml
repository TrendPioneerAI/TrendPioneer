name: WhenRest publish and verify
on:
  workflow_dispatch:
    inputs:
      enable_pages:
        description: 'Attempt GitHub Pages only after repository owner enables Pages access'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'whenrest/index.html'
      - 'whenrest/test_public.py'
      - '.github/workflows/whenrest-publish.yml'
permissions:
  contents: read
concurrency:
  group: whenrest-publish
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          pip install 'playwright>=1.48,<2' 'requests>=2.32,<3'
          python -m playwright install --with-deps chromium
      - name: Verify the public dashboard and live data
        run: python whenrest/test_public.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whenrest-public-verification
          path: whenrest-test
  pages:
    if: github.event_name == 'workflow_dispatch' && inputs.enable_pages
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure previously enabled GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare web-only publish directory
        run: |
          mkdir -p _site
          cp whenrest/index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
