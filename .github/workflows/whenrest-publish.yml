name: WhenRest publish and verify
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'whenrest/index.html'
      - 'whenrest/test_public.py'
      - '.github/workflows/whenrest-publish.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: whenrest-publish
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          pip install 'playwright>=1.48,<2' 'requests>=2.32,<3'
          python -m playwright install --with-deps chromium
      - name: Verify the public dashboard and live data
        run: python whenrest/test_public.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whenrest-public-verification
          path: whenrest-test
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare web-only publish directory
        run: |
          mkdir -p _site
          cp whenrest/index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published HTML
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os, time, urllib.request
          url=os.environ['PAGE_URL']
          for attempt in range(6):
              try:
                  with urllib.request.urlopen(url, timeout=20) as r:
                      html=r.read().decode('utf-8')
                      assert '<title>WhenRest' in html
                      print('WHENREST_PAGES_URL', url, 'HTTP', r.status)
                      break
              except Exception:
                  if attempt==5: raise
                  time.sleep(10)
          PY
