name: WhenRest public-data collection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'whenrest/collect.py'
      - '.github/workflows/whenrest-collect.yml'
  schedule:
    - cron: '2-59/5 * * * *'
permissions:
  contents: write
concurrency:
  group: whenrest-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5'
      - name: Collect public sources
        run: python whenrest/collect.py
      - name: Publish current data and source health
        run: |
          git config user.name 'whenrest-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add whenrest/data.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(whenrest): refresh public sources [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Write collection summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('whenrest/data.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('# WhenRest collection\n')
              if p.exists():
                  d = json.loads(p.read_text())
                  f.write('Generated: ' + d['generatedAt'] + '\n\n')
                  f.write('Reset records: ' + str(len(d['events'])) + '\n\n')
                  for s in d['sources']:
                      f.write('- ' + s['name'] + ': ' + s['status'] + (' / ' + s.get('error', '') if s.get('error') else '') + '\n')
              else:
                  f.write('Collector did not produce data.\n')
          PY
